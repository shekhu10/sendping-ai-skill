name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Validate skill metadata
        run: |
          python - <<'PY'
          import re
          import yaml
          from pathlib import Path

          source = Path("SKILL.md").read_text()
          match = re.match(r"^---\n(.*?)\n---", source, re.DOTALL)
          assert match, "SKILL.md must start with YAML frontmatter"
          metadata = yaml.safe_load(match.group(1))
          assert metadata["name"] == "sendping-ai-skill"
          assert metadata.get("description")
          assert "[TODO:" not in source
          PY
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile scripts
        run: python -m py_compile scripts/*.py
